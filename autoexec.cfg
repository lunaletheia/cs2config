echo ---------------------------------------- loading config ----------------------------------------

// SCRIPTS, AlIASES
        echo ~ scripts
    // audio
        alias blip_on "play buttons/blip1"
        alias blip_off "play buttons/blip2"
        alias button "play buttons/button9"
        alias sequence "play weapons/tec9/tec9_boltpull"
        alias enable "play weapons/c4/c4_click"
        alias disable "play ui/menu_back"
        alias select_on "play weapons/p250/p250_clipout"
        alias select_off "play weapons/weapon_zoom_out_02"
        alias invalid "play ui/menu_invalid"
        alias beep "play ui/beepclear"
        alias geiger "play player/geiger1"
        alias double_geiger "play player/geiger2"
        alias click "play ui/panorama/sidemenu_click_01.wav"
        alias roll "play ui/panorama/sidemenu_rollover_02.wav"
        alias music "play ui/panorama/music_equip_01.wav"
        alias snowball "play player/winter/snowball_throw_02.wav"
        alias rotate_off "play ui/panorama/rotate_weapon_06"
        alias rotate_on "play ui/panorama/rotate_weapon_03"
        alias book "play ui/ui_book_page_bwd"
    // fixer
        alias fixer "callvote kick 0; gameui_allowescape; gameui_allowescapetoshow; gameui_activate; gameui_hide; record fixer; stop; double_geiger"
    // ignore messages
        alias ignore-messages "ignore-messages_one"
        alias ignore-messages_one "ignoremsg; sequence; alias ignore-messages ignore-messages_two"
        alias ignore-messages_two "ignoremsg; sequence; alias ignore-messages ignore-messages_three"
        alias ignore-messages_three "ignoremsg;sequence; alias ignore-messages ignore-messages_four"
        alias ignore-messages_four "ignoremsg; sequence; alias ignore-messages ignore-messages_one"
    // ignore radio
        alias ignore-radio "ignore-radio_on"
        alias ignore-radio_on "ignorerad; enable; alias ignore-radio ignore-radio_off"
        alias ignore-radio_off "ignorerad; disable; alias ignore-radio ignore-radio_on"
    // mute enemy
        alias mute-enemy-team "mute-enemy-team_on"
        alias mute-enemy-team_on "cl_mute_enemy_team 1; enable; alias mute-enemy-team mute-enemy-team_off"
        alias mute-enemy-team_off "cl_mute_enemy_team 0; disable; alias mute-enemy-team mute-enemy-team_on"
    // fps scoreboard
        alias "+scores-fps" "+showscores; cl_hud_telemetry_net_detailed 2; cl_hud_telemetry_net_quality_graph_show 2"
        alias "-scores-fps" "-showscores; cl_hud_telemetry_net_detailed 0; cl_hud_telemetry_net_quality_graph_show 0"
    // debug console
        alias debug-console "net_print_sdr_ping_times; cl_ticktiming print; net_status; cl_net_printsummary; status; book"
    // debug hud
        alias debug-hud "debug-hud_on"
        alias debug-hud_on "cl_hud_telemetry_serverrecvmargin_graph_show 2; cl_hud_telemetry_frametime_show 2; cl_hud_telemetry_ping_show 2; cl_hud_telemetry_net_detailed 2; cl_hud_telemetry_net_misdelivery_show 2; cl_hud_telemetry_net_quality_graph_show 2; r_show_build_info 1; r_show_time_info 1; rotate_on; alias +scores-fps +showscores; alias -scores-fps -showscores"
    // bomb drop
        alias "+bomb-drop" "slot3; slot5"
        alias "-bomb-drop" "drop"
    // observed crosshair
        alias observed-crosshair "observed-crosshair_on"
        alias observed-crosshair_on "cl_show_observer_crosshair 2; click; alias observed-crosshair observed-crosshair_off"
        alias observed-crosshair_off "cl_show_observer_crosshair 0; click; alias observed-crosshair observed-crosshair_on"
    // shortcuts
        alias dd "disconnect"
        alias qq "quit"
        alias rs "mp_restartgame 1"
        alias ss "status"

// KEYBINDS
        echo ~ keybinds
        unbindall
        key_updatelayout                                                // Updates game keyboard layout to the current Windows keyboard setting.
        cl_input_enable_raw_keyboard "0"                                // Send keyboard input directly to the game engine without being processed by the operating system.
        input_button_code_is_scan_code_scd "1"                          // Bind keys based on keyboard position instead of key name.
    // slots
        bind "mouse5"         "slot1"                                   // [mouse5] Equip: Primary weapon.
        bind "mouse4"         "slot2"                                   // [mouse4] Equip: Secondary weapon.
        bind "mouse3"         "slot3"                                   // [mouse3] Equip: Knife, Zeus.
        bind "scancode6"      "slot8"                                   // [c] Equip: Smoke Grenade.
        bind "scancode8"      "slot7"                                   // [e] Equip: Flashbang.
        bind "scancode10"     "slot6"                                   // [g] Equip: High Explosive Grenade or Snowball.
        bind "scancode30"     "slot5"                                   // [1] Equip: C4 Explosive or Medi-Shot.
        bind "scancode32"     "slot10"                                  // [3] Equip: Incendiary Grenade/Molotov.
        bind "scancode33"     "slot9"                                   // [4] Equip: Decoy Grenade.
    // movement
        bind "scancode4"      "+left"                                   // [a] Strafe left.
        bind "scancode7"      "+right"                                  // [d] Strafe right.
        bind "scancode22"     "+back"                                   // [s] Move back.
        bind "scancode26"     "+forward"                                // [w] Move forward.
        bind "mouse_x"        "yaw"                                     // Controls the mouse screen movement on vertical axis.
        bind "mouse_y"        "pitch"                                   // Controls the mouse screen movement on horizontal axis.
        bind "scancode225"    "+sprint"                                 // [shift] Walk.
        bind "scancode224"    "+duck"                                   // [ctrl] Duck/Crouch.
        bind "scancode44"     "+jump"                                   // [space] Jump.
    // chat
        bind "scancode53"     "messagemode2"                            // [#] Team messages.
        bind "scancode40"     "messagemode"                             // [enter] Global messages.
    // comms
        bind "scancode29"     "+voicerecord"                            // [y] Push to talk. 
        bind "scancode31"     "player_ping"                             // [2] Ping.
    // other
        bind "mouse1"         "+attack"                                 // Primary Fire.
        bind "mouse2"         "+attack2"                                // Secondary fire.
        bind "scancode9"      "+use"                                    // [f] Interact.
        bind "scancode5"      "buymenu"                                 // [b] Open the buy menu.
        bind "scancode11"     "+lookatweapon"                           // [h] Inspect the weapon.
        bind "scancode27"     "drop"                                    // [x] Drop the current weapon.
        bind "scancode14"     "callvote"                                // [k] Open the vote menu.
        bind "scancode16"     "teammenu"                                // [m] Open the team selection menu.
        bind "scancode17"     "noclip"                                  // [n] Toggle the ability to pass through the walls (sv_cheats required).
        bind "scancode19"     "toggle spec_show_xray"                   // [p] Toggles the x-ray during spec.
        bind "scancode21"     "+reload"                                 // [r] Reload the currently weapon.
        bind "scancode23"     "+spray_menu"                             // [t] Open the spray menu.
        bind "scancode41"     "cancelselect"                            // [esc] Open/close the game menu.
        bind "scancode43"     "+scores-fps"                             // [tab] Shows the scoreboard and framerate.
        bind "scancode76"     "sellbackall"                             // [del] Refund all the bought items during the round.
        bind "scancode74"     "volume 0.3"                              // [pgup] Set sound to default.
        bind "scancode77"     "volume 0"                                // [pgdn] Mute the sound.
        bind "scancode15"     "toggleconsole"                           // [l] Open the developer console.
        bind "scancode55"     "observed-crosshair"                      // [.] Toggle observed player crosshair.
        bind "scancode65"     "autobuy"                                 // [f8] Enable/Disable Auto-buy at deathmatch gamemode.
    // scripts
        bind "scancode13"     "+bomb-drop"                              // [j] Fast bomb drop {script}.
        bind "scancode47"     "debug-hud"                               // ([) Enable visual (hud) debug {script}.
        bind "scancode48"     "debug-console"                           // (]) Output debug informations in console {script}.
        bind "scancode60"     "clutch_mode_toggle; select_on"           // [f3] Toggle the clutch mode (silence the teammates until next round or death) {uses audio effect}.
        bind "scancode61"     "mute-enemy-team"                         // [f4] Toggle enemy team communication (disables the enemy chat too) {script}.
        bind "scancode62"     "ignore-messages"                         // [f5] Toggle chat messages (disables the messages of - 1: enemy, 2: enemy & team, 3: all) {script}.
        bind "scancode63"     "ignore-radio"                            // [f6] Toggle the radio messages {script}.
        bind "scancode64"     "fixer"                                   // [f7] Execute the Fixer which may fix graphical glitches, sound glitches, hud bugs etc. {script}.
    // settings
        cl_buywheel_nonumberpurchasing "1"                              // Prevent buy wheel from purchasing via number keys.
        cl_debounce_zoom "1"                                            // Disable zoom-cycle.
        cl_silencer_mode "0"                                            // Detach silencer on supported weapons.
        cl_use_opens_buy_menu "0"                                       // Pressing the +use key will open the buy menu if in a buy zone (just as if the 'buy' key is pressed).
        cl_scoreboard_mouse_enable_binding "+attack2"                   // The type of binding which enables mouse selection in the scoreboard.
        cl_buywheel_donate_key "0"                                      // Set the key to use for donation in the buy menu. 0: Left Control. 1: Left Alt. 2: Left Shift.
        option_duck_method "0"                                          // Crouch toggle.
        option_speed_method "0"                                         // Walk toggle.
        joystick "0"                                                    // Joystick game engine controller support.
        cl_joystick_enabled "0"                                         // Joystick input recognition within the game.

// HUD
        echo ~ hud
        con_enable "1"                                                  // Allows the console to be activated.
        developer "1"                                                   // Set developer message level.
        player_nevershow_communityservermessage "1"                     // Disable community server message.
        hud_scaling "1"                                                 // Scales HUD elements.
        cl_hud_color "1"                                                // Set the color of HUD elements.
        cl_color "3"                                                    // Preferred teammate color.
        cl_weapon_selection_rarity_color "0"                            // Make weapon icons in the hud glow with their rarity color.
        cl_sanitize_muted_players "1"                                   // Hide names and avatars of muted players.
        cl_sanitize_player_names "0"                                    // Replace names of other players with something non-offensive.
        cl_hide_avatar_images "2"                                       // Hide avatar images for other players.
        cl_allow_animated_avatars "0"                                   // Enable in-game animated avatars.
        cl_teamcounter_playercount_instead_of_avatars "1"               // Determines how to display players in the HUD.
        cl_hud_radar_scale "1.3"                                        // Set the scale of the radar HUD element.
        cl_hud_radar_background_alpha "1"                               // Adjust the transparency level of the radar background in the HUD.
        cl_hud_radar_map_additive "1"                                   // Blend hud radar map additively on top of background.
        cl_radar_scale "0.4"                                            // Set the scale of the radar interior display.
        cl_radar_icon_scale_min "0.6"                                   // Set the minimum icon scale.
        cl_radar_always_centered "0"                                    // Center the radar around the player.
        cl_radar_rotate "1"                                             // Rotate the radar in the direction the player is facing.
        cl_player_ping_mute "0"                                         // Player pinging.
        cl_radar_square_with_scoreboard "0"                             // The radar will toggle to a square when the scoreboard is visible.
        cl_teamid_overhead_colors_show "1"                              // Show team overhead id in teammate color.
        cl_show_observer_crosshair "2"                                  // Show the crosshair of the player being observed.
        cl_observed_bot_crosshair "0"                                   // Control the crosshair shown when observing a bot.
        cl_teamid_overhead_mode "2"                                     // Always show team id over teammates.
        cl_teamid_overhead_fade_near_crosshair "0.75"                   // Controls the transparency of name tags when the crosshair is aimed near them.
        cl_teammate_colors_show "1"                                     // Set players on the team to have different colors on the radar and scoreboard.
        gameinstructor_enable "0"                                       // Displays in game lessons that teach new players.
        cl_autohelp "0"                                                 // Auto-help.
        cl_showloadout "1"                                              // Display the current loadout.
        cl_showfps "0"                                                  // Draw fps meter.
        cl_deathnotices_show_numbers "0"                                // Appending observer numbers to kill feed.
        cl_prefer_lefthanded "0"                                        // Use the left hand to hold the weapon in the games view model.
        viewmodel_presetpos "1"                                         // Viewmodel position.
        viewmodel_fov "68"                                              // .
        viewmodel_offset_x "2.5"                                        // .
        viewmodel_offset_y "0"                                          // .
        viewmodel_offset_z "-1.5"                                       // .
        r_drawtracers_firstperson "0"                                   // Toggles the visibility of first-person weapon tracers (bullets).
        cl_dm_buyrandomweapons "0"                                      // Recieve a random weapon on spawn in deathmatch.
        cl_spec_stats "1"                                               // Show stats screen in spectator view.
        cl_spec_show_bindings "1"                                       // Toggle the visibility of the spectator bindings.
        spec_usenumberkeys_nobinds "1"                                  // Map voting and spectator view use the raw number keys.
        cl_obs_interp_enable "0"                                        // Interpolation between observer targets.
        spec_show_xray "1"                                              // Show player outlines and name IDs through walls.
        ui_steam_overlay_notification_position "bottomright"            // bottomright: Display notifications at the bottom right corner.
        cl_hud_telemetry_frametime_show "2"                             // Show in the HUD the modern frame rate and FPS meter.
        cl_hud_telemetry_frametime_poor "8"                             // A frame rate that exceeds the 'poor' threshold.
        cl_hud_telemetry_net_misdelivery_show "2"                       // Show packets lost or missed.
        cl_hud_telemetry_net_misdelivery_poor "5"                       // A packet delivery anomaly rate that exceeds the 'poor' threshold.
        cl_hud_telemetry_ping_show "2"                                  // Show ping in the HUD.
        cl_hud_telemetry_ping_poor "60"                                 // A ping rate that exceeds the 'poor' threshold.
        cl_hud_telemetry_net_quality_graph_show "0"                     // Show packet jitter and netframe loss/reordering in the HUD.
        cl_hud_telemetry_net_detailed "0"                               // Show breakdown network misdelivery.
        cl_ticks_net_print_threshold "2"                                // Print a message if network issues cause prolems past this threshold.
        cl_frametime_summary_report_detailed "1"                        // Generates a detailed dump report of the systems performance at the end of session.
        ui_vanitysetting_loadoutslot_ct "equipment1"                    // Main Menu Counter-Terrorist Agent loadout.
        ui_vanitysetting_loadoutslot_t "equipment1"                     // Main Menu Terrorist Agent loadout.
        ui_playsettings_mode_official_v20 "premier"                     // Default: premier.
        eom_local_player_defeat_anim_enabled "1"                        // End of match - local player defeat animation.
        r_show_build_info "1"                                           // Show the build version in the bottom left corner.
    
// CROSSHAIR, PRESET
        echo ~ crosshair
    // default dot preset
        crosshair "1"                                                   // Toggle the crosshair.
        cl_crosshairstyle "4"                                           // Crosshair type. 0: Scaleform Default, 1: Scaleform Small, 2: Classic, 3: Classic Dynamic, 4: Classic Static, 5: Classic Dynamic
        cl_crosshair_recoil "0"                                         // Follow recoil.
        cl_crosshairsize "0"                                            // Length of crosshair lines.
        cl_crosshairthickness "1"                                       // Thickness of crosshair lines.
        cl_crosshairgap "-4"                                            // Center gap between crosshair lines.
        cl_crosshairgap_useweaponvalue "0"                              // The gap will update dynamically based on which weapon is equipped.
        cl_fixedcrosshairgap "-2"                                       // How big to make the gap between the pips.
        cl_crosshairdot "1"                                             // Dot in the center of the crosshair.
        cl_crosshair_t "0"                                              // T style crosshair.
        cl_crosshair_drawoutline "1"                                    // Draws a black outline around the crosshair for better visibility.
        cl_crosshair_outlinethickness "1"                               // Sets how thick it draws the crosshair outline.
        cl_crosshairusealpha "1"                                        // Transparency of corsshair lines.
        cl_crosshairalpha "255"                                         // Transparency value of corsshair lines.
        cl_crosshaircolor "5"                                           // Sets crosshair color as defined in game_options.consoles.txt. 5: Custom.
        cl_crosshaircolor_R "255"                                       // Color.
        cl_crosshaircolor_G "255"                                       // .
        cl_crosshaircolor_B "255"                                       // .
        cl_crosshair_dynamic_maxdist_splitratio "1"                     // The ratio used to decide how long the inner and outer crosshair lines will be.
        cl_crosshair_dynamic_splitalpha_innermod "0"                    // The alpha modification that will be used for the inner crosshair lines once theyve split.
        cl_crosshair_dynamic_splitalpha_outermod "1"                    // The alpha modification that will be used for the outer crosshair lines once theyve split.
        cl_crosshair_dynamic_splitdist "3"                              // The distance that the crosshair lines will split into 2 (when firing a weapon or during movement).
    // preset aliases (as set in ./crosshairs/)
        alias ch_dot "exec crosshairs/dot.cfg"                          // Apply preset for the dot crosshair
    // cycle crosshair
        alias cycle_ch "cycle_ch_0"                                     // Cycle through the presets set in ./crosshairs/
        alias cycle_ch_0 "ch_dot; alias cycle_ch cycle_ch_1"            // .
        alias cycle_ch_1 "ch_donk; alias cycle_ch cycle_ch_0"           // .
        bind "scancode56" "cycle_ch"                                    // [-] Cycle crosshairs
    // misc
        hud_showtargetid "0"                                            // Display enemys name.
        cl_crosshair_friendly_warning "0"                               // Friend corsshair hover warning.
        cl_crosshair_sniper_width "1"                                   // Sniper scope cross lines width.
        cl_grenadecrosshair_decoy "1"                                   // Display the customizable grenade crosshair when the player has a decoy grenade equipped.
        cl_grenadecrosshair_explosive "1"                               // Display the customizable grenade crosshair when the player has an explosive (HE) grenade equipped.
        cl_grenadecrosshair_fire "1"                                    // Display the customizable grenade crosshair when the player has a molotov/incendiary grenade equipped.
        cl_grenadecrosshair_flash "1"                                   // Display the customizable grenade crosshair when the player has a flashbang equipped.
        cl_grenadecrosshair_smoke "1"                                   // Display the customizable grenade crosshair when the player has a smoke grenade equipped.
        cl_grenadecrosshair_keepusercrosshair "0"                       // Retain the usual crosshair while holding a grenade (otherwise replace it with a specific grenade lineup crosshair).
        cl_grenadecrosshairdelay_decoy "2"                              // Adjust the timing of the customizable grenade crosshair, which affects how quickly after pulling the decoy pin, the crosshair reflects the change.
        cl_grenadecrosshairdelay_explosive "2"                          // Adjust the timing of the customizable grenade crosshair, which affects how quickly after pulling the explosive (HE) pin, the crosshair reflects the change.
        cl_grenadecrosshairdelay_fire "2"                               // Adjust the timing of the customizable grenade crosshair, which affects how quickly after pulling the molotov/incendiary pin, the crosshair reflects the change.
        cl_grenadecrosshairdelay_flash "2"                              // Adjust the timing of the customizable grenade crosshair, which affects how quickly after pulling the flashbang pin, the crosshair reflects the change.
        cl_grenadecrosshairdelay_smoke "2"                              // Adjust the timing of the customizable grenade crosshair, which affects how quickly after pulling the smoke pin, the crosshair reflects the change.
        
// AUDIO
        echo ~ audio
    // volume
        volume "0.3"                                                    // Main.
        snd_menumusic_volume "0"                                        // Relative volume of the main menu music.
        snd_menumap_volume "0"                                          // Volume of background sounds for maps.
        snd_roundstart_volume "0"                                       // Relative volume of round start music.
        snd_roundend_volume "0"                                         // Relative volume of round end music.
        snd_mapobjective_volume "0"                                     // Relative volume of map objective music.
        snd_deathcamera_volume "0"                                      // Relative volume of the death camera music.
        snd_tensecondwarning_volume "0.0025"                            // Relative volume of ten second warning music.
        snd_mvp_volume "0"                                              // Relative volume of the MVP music.
    // eq and balance
        snd_headphone_eq "1"                                            // Select Headphone EQ Preset. 0: Natural, 1: Crist, 2: Smooth.
        snd_spatialize_lerp "0"                                         // L/R isolation. 0: Physically Accurate, 1: Isolated.
        snd_steamaudio_enable_perspective_correction "1"                // Perspective correction for 3D audio.
    // misc
        snd_steamaudio_reverb_level_db "-3"                             // Adjust overall volume (dB) of the output from Steam Audio Reverb processor.
        snd_autodetect_latency "1"                                      // Automatic buffer latency detection (requires driver support).
        snd_mixahead "0.001"                                            // Regulates the time given to the audio system to process sound. Any higher value may bug the sound.
        snd_mute_mvp_music_live_players "1"                             // Mute MVP music if players from both teams are still alive.
        snd_mute_losefocus "1"                                          // Disables the game sound when the game loses focus (tabbed out).
        snd_toolvolume "0.1"                                            // Volume of sounds in tools (e.g. Hammer, SFM)
        cl_embedded_stream_audio_volume "0"                             // Embedded stream audio volume.
        cl_embedded_stream_audio_volume_xmaster "1"                     // Multiply embedded stream audio volume via master volume.
        snd_voipvolume "0.3"                                            // Volume level of incoming voice.
        cl_mute_enemy_team "0"                                          // Block all communication from players on the enemy team.
        cl_mute_all_but_friends_and_party "0"                           // Only allow communication from friends and matchmaking party members.
        cl_clutch_mode "0"                                              // Silence voice and other distracting sounds until the end of round or next death.
        voice_loopback "0"                                              // Listen back to the connected microphone.
        voice_threshold "-110"                                          // Microphone sensitivity (decibel threshold) when using voice activation instead of 'Push-to-talk'.
        voice_modenable "1"                                             // Toggle the microphone.
        voice_always_sample_mic "0"                                     // Opens the VOIP audio input stream when the application launches (instead of when it is first used).
        voice_device_override "0"                                       // Default device used for voice capture.

// MOUSE
        echo ~ mouse
        sensitivity "0.55"                                              // Mouse sensitivity.
        zoom_sensitivity_ratio "0.8"                                    // Additional mouse sensitivity scale factor applied when FOV is zoomed in.
        m_pitch "0.022"                                                 // Mouse pitch factor.
        m_yaw "0.022"                                                   // Mouse yaw factor speed sensitivity multiplier.
        
// NETWORK
        echo ~ network
    // bandwidth
        rate "1000000"                                                  // 0.7Mbps: 98304, 1.0Mbps: 131072, 1.5Mbps: 196608, 2.0Mbps: 262144, 2.5Mbps: 327680, 3.0Mbps: 393216, 4.0Mbps: 524288, 5.0Mbps: 655360, 6.0Mbps: 786432, 7.6Mbps: 1000000.
    // buffer
        cl_net_buffer_ticks "0"                                         // 0: Deactivates the entity interpolation, 1: Reduces entity interpolation times to a minimum, 2: Interpolate over 2 snapshots.
        cl_net_buffer_ticks_use_interp "1"                              // Packets are processed upon receipt and cl_interp is used to delay their effects, rather than smoothing over packet loss by adjusting the clock synchronization to buffer packets.
        cl_tickpacket_desired_queuelength "0"                           // The desired queue length for outgoing tick packets. 0: No extra buffer, 1-2: Slight buffer (some input lag), 3+: Larger buffer (increased input lag).
    // damage prediction
        cl_predict_body_shot_fx "0"                                     // Predict the audio/visual effects of bodyshots such as blood spurts and sound effects.
        cl_predict_head_shot_fx "0"                                     // Predict the audio/visual effects of head shots such as sparks and dink sounds.
        cl_predict_kill_ragdolls "0"                                    // Targets immediately ragdoll when a kill is predicted.
    // lobby
        lobby_default_privacy_bits2 "0"                                 // Lobby default permissions. 0: Private, 1: Public.
        cl_invites_only_friends "1"                                     // Ignore in-game invites from recent teammates or other non-friends.
        cl_invites_only_mainmenu "0"                                    // Ignore all invites when user is playing a match.
        ui_setting_advertiseforhire_auto "0"                            // Users automatically advertise for invites. 0: Disabled, 1: Last, 2: Auto.
    // misc
        net_client_steamdatagram_enable_override "1"                    // Select a relay. 0: Use the connect method requested by GC, >0: Always use SDR if possible, <0: Always use direct UDP if possible.
        mm_session_search_qos_timeout "20"                              // Quality of Service timeout (no response) in seconds.
        mm_dedicated_search_maxping "35"                                // Longest preferred ping to dedicated servers for games.
        mm_csgo_community_search_players_min "3"                        // When performing CS:GO community matchmaking look for servers with at least so many human players.
        cl_resend "0.5"                                                 // Delay in seconds before the client will resend the 'connect' attempt.
        cl_timeout "30"                                                 // Delay in seconds without receiving a packet from the server before the client will disconnect itself.
        
// VIDEO
        echo ~ video
    // screen
        r_fullscreen_gamma "2.0"                                        // Screen Gamma (only in fullscreen modes). 1.6: Highest - 2.6: Lowest.
        fps_max "360"                                                   // Frame rate limiter.
        fps_max_ui "240"                                                // Frame rate limiter while the game UI/main menu is displayed.
        fps_max_tools "120"                                             // Frame rate limiter while in tools mode and a window other than the game window in focus.
    // performance
        thread_pool_option "0"                                          // CPU cores usage preference. 0?: Performance cores only, 1?: Efficiency cores only, 2?: Prefer performance cores, 3: No preference.
        engine_low_latency_sleep_after_client_tick "1"                  // Moves the low latency sleep on tick frames to happen after client simulation.
        engine_no_focus_sleep "15"                                      // Controls the time the engine sleeps per frame when the game is not in focus.

echo ---------------------------------------- loaded config -----------------------------------------